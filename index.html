<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>환타지 화성 - 생물자원보전 퀴즈</title>
<meta name="description" content="환타지 화성 생물자원보전 퀴즈! 문제를 맞히고 현장 부스에서 경품을 받아가세요." />
<meta property="og:type" content="website" />
<meta property="og:title" content="환타지 화성 - 생물자원보전 퀴즈" />
<meta property="og:description" content="문제를 맞히고 경품을 받자! 환타지 화성 생물자원보전 랜덤 퀴즈." />
<meta property="og:image" content="logo.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="환타지 화성 - 생물자원보전 퀴즈" />
<meta name="twitter:description" content="문제를 맞히고 경품을 받자! 환타지 화성 생물자원보전 랜덤 퀴즈." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />
<style>
  :root {
    --leaf: #3aa663;
    --leaf-deep: #1f7a44;
    --lake: #3b9ad8;
    --lake-deep: #1f6fa6;
    --sun: #f6c343;
    --sun-deep: #d99a14;
    --berry: #e26d8a;
    --magic: #8c6bd9;
    --ink: #1d2a22;
    --paper: #fbf8ee;
    --cream: #fff8e1;

    --font-body: 'SUIT Variable', 'Gowun Dodum', system-ui, -apple-system, sans-serif;
    --font-display: 'SUIT Variable', 'Jua', sans-serif;
    --font-head: 'SUIT Variable', 'Black Han Sans', sans-serif;

    --shadow-soft: 0 10px 28px rgba(29, 42, 34, 0.08);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    background:
      radial-gradient(circle at 8% 10%, #d9efd6 0 14%, transparent 15%),
      radial-gradient(circle at 92% 18%, #d4ecf8 0 13%, transparent 14%),
      radial-gradient(circle at 18% 88%, #fcf0c8 0 14%, transparent 15%),
      radial-gradient(circle at 86% 82%, #e4f3d8 0 13%, transparent 14%),
      var(--paper);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: '';
    position: fixed;
    pointer-events: none;
    z-index: 0;
    inset: 0;
    background:
      repeating-linear-gradient(135deg, rgba(31, 122, 68, 0.05) 0 2px, transparent 2px 22px);
  }

  .stage {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 18px 64px;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
    text-align: center;
  }
  .titlebar .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--leaf) 0%, #4cb87a 100%);
    color: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 7px 18px 7px 14px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
    transform: rotate(-3deg);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .titlebar .badge::before {
    content: '✨';
    font-size: 13px;
  }
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  .logo-card {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px auto 6px;
    padding: 20px 24px;
    border: 4px solid var(--ink);
    border-radius: 24px;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,0.95) 0%, transparent 55%),
      linear-gradient(135deg, #ffffff 0%, #f1faec 100%);
    box-shadow: 6px 6px 0 var(--ink), var(--shadow-soft);
    position: relative;
    max-width: min(480px, 92vw);
  }
  .logo-card::before {
    content: '🌿';
    position: absolute;
    top: -22px; left: -14px;
    font-size: 30px;
    transform: rotate(-18deg);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
  }
  .logo-card::after {
    content: '💧';
    position: absolute;
    bottom: -18px; right: -10px;
    font-size: 28px;
    transform: rotate(14deg);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
  }
  .logo-card .logo {
    display: block;
    width: 100%;
    max-width: 360px;
    height: auto;
    border-radius: 10px;
  }
  .logo-card .logo-fallback {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 6px;
  }
  .logo-card .logo-fallback .row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-head);
    font-weight: 900;
    font-size: clamp(24px, 5.2vw, 32px);
    color: var(--leaf-deep);
    letter-spacing: 0.5px;
  }
  .logo-card .logo-fallback .row .leaf { font-size: 1.2em; }
  .logo-card .logo-fallback .sub {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--lake-deep);
  }

  .titlebar .lead {
    font-family: var(--font-head);
    font-weight: 900;
    font-size: clamp(22px, 5.5vw, 30px);
    color: var(--ink);
    margin: 10px 0 0;
    letter-spacing: -0.2px;
    line-height: 1.35;
  }
  .titlebar .lead .accent {
    color: var(--leaf-deep);
    background: linear-gradient(180deg, transparent 62%, rgba(246, 195, 67, 0.4) 62%, rgba(246, 195, 67, 0.4) 92%, transparent 92%);
    padding: 0 3px;
  }
  .titlebar .sub {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: #5a6b5f;
  }

  .card {
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 24px;
    box-shadow: 8px 8px 0 var(--ink), var(--shadow-soft);
    padding: 26px 22px 22px;
    position: relative;
    margin-top: 8px;
  }
  .card::before {
    content: '문제';
    position: absolute;
    top: -16px; left: 22px;
    padding: 5px 16px;
    background: var(--sun);
    transform: rotate(-4deg);
    border: 3px solid var(--ink);
    border-radius: 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .qhead {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0 14px;
  }
  .qnum {
    background: var(--leaf);
    color: #fff;
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 4px 14px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .qtag {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--lake-deep);
    font-size: 14px;
  }

  .qtext {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(19px, 4.3vw, 24px);
    line-height: 1.55;
    margin: 8px 0 20px;
    word-break: keep-all;
    color: var(--ink);
  }

  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 520px) {
    .options { grid-template-columns: 1fr 1fr; }
  }

  .opt {
    appearance: none;
    text-align: left;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 14px 14px 14px 54px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16.5px;
    cursor: pointer;
    position: relative;
    transition: transform 0.18s var(--ease-bounce), box-shadow 0.18s var(--ease-out), background 0.2s ease, border-color 0.2s ease;
    box-shadow: 4px 4px 0 var(--ink);
    color: var(--ink);
    line-height: 1.45;
    word-break: keep-all;
  }
  .opt:hover:not(:disabled) {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink);
    background: #f3faef;
  }
  .opt:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
    transition-duration: 0.08s;
  }
  .opt:focus-visible {
    outline: 3px solid var(--lake-deep);
    outline-offset: 3px;
  }
  .opt .num {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--leaf);
    border: 2.5px solid var(--ink);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .opt:nth-child(2) .num { background: var(--lake); }
  .opt:nth-child(3) .num { background: var(--sun-deep); }
  .opt:nth-child(4) .num { background: var(--berry); }

  .opt.correct {
    background: #e4f8da;
    border-color: var(--leaf-deep);
    box-shadow: 4px 4px 0 var(--leaf-deep);
  }
  .opt.correct .num { background: var(--leaf-deep); }
  .opt.wrong {
    background: #ffe1e1;
    border-color: #c0392b;
    box-shadow: 4px 4px 0 #c0392b;
  }
  .opt.wrong .num { background: #c0392b; }
  .opt:disabled { cursor: not-allowed; opacity: 0.96; }

  .result {
    margin-top: 20px;
    border: 3px dashed var(--ink);
    border-radius: 18px;
    padding: 16px 18px;
    background: #fffbe6;
    display: none;
  }
  .result.show { display: block; animation: pop 0.45s var(--ease-bounce); }
  .result .verdict {
    font-family: var(--font-head);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .result.ok { background: #effbe6; border-color: var(--leaf-deep); }
  .result.ok .verdict { color: var(--leaf-deep); }
  .result.no { background: #fff1f1; border-color: #c0392b; }
  .result.no .verdict { color: #c0392b; }
  .result .explain {
    margin-top: 8px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15.5px;
    line-height: 1.7;
    color: #2c352e;
  }
  .result .explain b { color: var(--leaf-deep); font-weight: 700; }
  .result.no .explain b { color: var(--lake-deep); font-weight: 700; }

  .prize {
    display: none;
    margin-top: 14px;
    padding: 16px 18px 14px;
    border: 3px solid var(--sun-deep);
    border-radius: 18px;
    background: linear-gradient(135deg, #fff7d6 0%, #fff2bd 60%, #ffe9a3 100%);
    box-shadow: 4px 4px 0 var(--sun-deep);
    position: relative;
    overflow: hidden;
  }
  .prize::after {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 60%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: rotate(20deg);
    pointer-events: none;
  }
  .prize.show { display: block; animation: pop 0.45s var(--ease-bounce) 0.1s both; }
  .prize.show::after { animation: shine 2.4s ease-in-out 0.6s 1; }
  .prize .title {
    font-family: var(--font-head);
    font-weight: 900;
    font-size: 22px;
    color: var(--sun-deep);
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  .prize .body {
    margin-top: 6px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15.5px;
    line-height: 1.65;
    color: #4a3a10;
    position: relative;
  }

  .footer-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn {
    appearance: none;
    border: 3px solid var(--ink);
    background: var(--leaf);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.3px;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.18s var(--ease-bounce), box-shadow 0.18s var(--ease-out), background 0.2s ease;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); transition-duration: 0.08s; }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.retry { background: var(--lake); }
  .btn.ghost { background: #fff; color: var(--ink); }

  .stickers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stickers span {
    position: absolute;
    font-size: 28px;
    opacity: 0.55;
    user-select: none;
    animation: float 7s ease-in-out infinite;
  }
  .stickers span:nth-child(1){ top: 7%; left: 4%; animation-delay: 0s; }
  .stickers span:nth-child(2){ top: 14%; right: 5%; animation-delay: 1.3s; }
  .stickers span:nth-child(3){ top: 60%; left: 3%; animation-delay: 2.5s; }
  .stickers span:nth-child(4){ top: 78%; right: 4%; animation-delay: 0.7s; }
  .stickers span:nth-child(5){ top: 44%; right: 7%; animation-delay: 1.9s; font-size: 22px; }
  .stickers span:nth-child(6){ top: 32%; left: 6%; animation-delay: 3.1s; }
  .stickers span:nth-child(7){ top: 88%; left: 38%; animation-delay: 2.2s; font-size: 18px; opacity: 0.4; }
  .stickers span:nth-child(8){ top: 24%; left: 46%; animation-delay: 0.5s; font-size: 16px; opacity: 0.45; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-14px) rotate(6deg); }
  }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  @keyframes shine {
    0% { transform: translateX(0) rotate(20deg); }
    100% { transform: translateX(420%) rotate(20deg); }
  }
  .shake { animation: shake 0.5s; }

  .confetti {
    position: fixed;
    pointer-events: none;
    inset: 0;
    overflow: hidden;
    z-index: 5;
  }
  .confetti i {
    position: absolute;
    top: -20px;
    width: 12px; height: 14px;
    background: var(--leaf);
    border-radius: 40% 60% 60% 40% / 60% 40% 60% 40%;
    transform: rotate(20deg);
    animation: fall 2.6s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(540deg); }
  }

  .topnote {
    font-family: var(--font-display);
    font-weight: 700;
    text-align: center;
    color: #5a6b5f;
    margin-top: 16px;
    font-size: 13px;
    letter-spacing: 0.3px;
  }

  .final {
    display: none;
    text-align: center;
    padding: 16px 8px 6px;
  }
  .final.show { display: block; animation: pop 0.5s var(--ease-bounce); }
  .final .headline {
    font-family: var(--font-head);
    font-weight: 900;
    font-size: clamp(24px, 6vw, 32px);
    color: var(--ink);
    letter-spacing: -0.3px;
    line-height: 1.25;
  }
  .final .score-ring {
    margin: 14px auto 6px;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 14px 26px;
    border: 4px solid var(--ink);
    border-radius: 22px;
    background: linear-gradient(135deg, #fff 0%, #f1faec 100%);
    box-shadow: 6px 6px 0 var(--ink), var(--shadow-soft);
    font-family: var(--font-head);
    font-weight: 900;
    color: var(--ink);
  }
  .final .score-ring .big {
    font-size: clamp(48px, 12vw, 64px);
    color: var(--leaf-deep);
    line-height: 1;
  }
  .final .score-ring .sep { font-size: 28px; color: #9aa39d; }
  .final .score-ring .total { font-size: 28px; color: #4a5a4f; }
  .final.no .score-ring .big { color: #c0392b; }
  .final .msg {
    margin-top: 14px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    line-height: 1.6;
    color: #2c352e;
    word-break: keep-all;
  }

  @media (prefers-reduced-motion: reduce) {
    .stickers span,
    .confetti i,
    .shake,
    .result.show,
    .prize.show,
    .prize.show::after,
    .final.show { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stickers" aria-hidden="true">
  <span>🌿</span>
  <span>💧</span>
  <span>🪷</span>
  <span>🦦</span>
  <span>🍃</span>
  <span>🐦</span>
  <span>✨</span>
  <span>⭐</span>
</div>

<main class="stage">
  <div class="titlebar">
    <h1 class="visually-hidden">환타지 화성 - 생물자원보전 퀴즈</h1>
    <span class="badge">환타지 화성</span>
    <div class="logo-card">
      <img class="logo" src="logo.png" alt="환타지 화성 로고"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div class="logo-fallback" style="display:none;">
        <div class="row"><span class="leaf">🌿</span><span>환타지 화성</span><span class="leaf">💧</span></div>
        <div class="sub">생물자원보전 랜덤 퀴즈</div>
      </div>
    </div>
    <p class="lead"><span class="accent">11문제</span> 풀고 <span class="accent">경품 받자!</span></p>
    <span class="sub">5문제 이상 정답이면 부스에서 경품 수령!</span>
  </div>

  <section class="card" id="card">
    <div class="qhead" id="qhead">
      <span class="qnum" id="qnum">Q1</span>
      <span class="qtag" id="qtag">1 / 11</span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="options" id="options"></div>

    <div class="final" id="final" aria-live="polite"></div>

    <div class="result" id="result" aria-live="polite">
      <div class="verdict" id="verdict"></div>
      <div class="explain" id="explain"></div>
    </div>

    <div class="prize" id="prize" aria-live="polite">
      <div class="title"><span aria-hidden="true">🎁</span><span>경품 안내</span></div>
      <div class="body" id="prizeBody"></div>
    </div>

    <div class="footer-bar" id="footer"></div>
  </section>

  <p class="topnote">화성시민과 함께하는 생물자원보전</p>
</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
  const QUESTIONS = [
    {
      q: "습지가 우리에게 주는 좋은 점이 아닌 것은 무엇일까요?",
      opts: ["물을 깨끗하게 해준다", "다양한 생물의 집이 된다", "홍수를 줄이는 데에 도움이 된다", "쓰레기를 더 많이 만든다"],
      answer: 3,
      explain: "습지는 <b>물을 정화</b>하고, <b>다양한 생물의 서식지</b>가 되며, 많은 비가 내릴 때 물을 저장해 <b>홍수를 줄여주는</b> 역할을 합니다."
    },
    {

    },
    {

      opts: ["철새", "코끼리", "기린", "캥거루"],

    },
    {

      answer: 3,
      explain: "습지와 호수는 <b>다양한 생물의 보금자리</b>일 뿐 아니라 <b>물을 저장</b>하고, 시민들에게 <b>자연을 체험</b>할 수 있는 공간을 제공합니다."
    },
    {

    {

      opts: ["시화호생태협의회", "시화호환경위원회", "시화호지속가능파트너십", "시화호보전협의회"],

      explain: "<b>시화호지속가능파트너십</b>은 기업·기관·시민단체가 함께 시화호의 환경보전과 지속가능한 발전을 도모하는 협력 협의체입니다."
    },
    {
      q: "화성시가 조성 중인 생물자원보전시설의 주요 목적은 무엇일까요?",
      opts: ["희귀 생물과 생태자원 보전", "대형 쇼핑몰 운영", "스포츠 경기 개최", "영화 촬영 전용 공간"],
      answer: 0,
      explain: "생물자원보전시설은 지역의 <b>생물다양성을 지키고</b>, 시민들이 <b>생태환경의 중요성</b>을 배울 수 있도록 조성되는 공간입니다."
    },
    {
      q: "생물자원보전시설에서 할 수 있는 것은 무엇일까요?",
      opts: ["생태 전시 관람", "생물다양성 교육 체험", "야생생물 보전 학습", "모두 맞다"],
      answer: 3,
      explain: "생물자원보전시설은 <b>전시 관람, 생태교육, 야생생물 보전 학습</b> 등 다양한 기능을 함께 하는 시설로 활용될 예정입니다."
    },
    {
      q: "화성시의 대표 환경전문 공공기관으로 환경교육, 생태보전, 탄소중립 사업을 추진하는 기관은 어디일까요?",
      opts: ["화성시청", "화성도시공사", "화성문화재단", "화성시환경재단"],
      answer: 3,
      explain: "<b>화성시환경재단</b>은 화성시의 환경교육·생태보전·탄소중립 사업을 전담하는 대표 환경전문 공공기관입니다."
    }
  ];

  const TOTAL = QUESTIONS.length;
  const PASS_THRESHOLD = 5;
  // 경품 안내 박스 표시 토글 (현재 보류 상태). true로 바꾸면 다시 노출.
  const SHOW_PRIZE = false;
  const PRIZE_NOTICE = "축하해요! 환타지 화성 현장 안내 부스에서 이 화면을 보여주시면 <b>참여 경품</b>을 받으실 수 있어요. 🌱";

  const els = {
    card: document.getElementById('card'),
    qhead: document.getElementById('qhead'),
    qnum: document.getElementById('qnum'),
    qtag: document.getElementById('qtag'),
    qtext: document.getElementById('qtext'),
    options: document.getElementById('options'),
    result: document.getElementById('result'),
    verdict: document.getElementById('verdict'),
    explain: document.getElementById('explain'),
    prize: document.getElementById('prize'),
    prizeBody: document.getElementById('prizeBody'),
    final: document.getElementById('final'),
    footer: document.getElementById('footer'),
    confetti: document.getElementById('confetti')
  };

  let state = {
    order: [],
    step: 0,
    correct: 0,
    locked: false
  };

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    state.order = shuffle(QUESTIONS.map((_, i) => i));
    state.step = 0;
    state.correct = 0;
    state.locked = false;
    els.final.classList.remove('show', 'ok', 'no');
    els.final.innerHTML = '';
    els.prize.classList.remove('show');
    els.qhead.style.display = '';
    els.qtext.style.display = '';
    els.options.style.display = '';
    renderQuestion();
  }

  function renderQuestion() {
    state.locked = false;
    const q = QUESTIONS[state.order[state.step]];

    els.qnum.textContent = 'Q' + (state.step + 1);
    els.qtag.textContent = (state.step + 1) + ' / ' + TOTAL + ' · 정답 ' + state.correct + '개';
    els.qtext.textContent = q.q;
    els.options.innerHTML = '';
    q.opts.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (i + 1);
      btn.appendChild(num);
      btn.appendChild(document.createTextNode(text));
      btn.addEventListener('click', () => onPick(i, btn));
      els.options.appendChild(btn);
    });

    els.result.classList.remove('show', 'ok', 'no');
    els.footer.innerHTML = '';
    clearConfetti();
  }

  function onPick(i, btn) {
    if (state.locked) return;
    state.locked = true;
    const q = QUESTIONS[state.order[state.step]];
    const buttons = els.options.querySelectorAll('.opt');
    buttons.forEach(b => b.disabled = true);

    const isLast = state.step === TOTAL - 1;
    const nextLabel = isLast ? '결과 보기 →' : '다음 문제 →';
    const correct = i === q.answer;

    if (correct) {
      state.correct++;
      btn.classList.add('correct');
      els.result.classList.add('show', 'ok');
      els.verdict.textContent = '딩동댕! 정답이에요!';
      els.explain.innerHTML = q.explain || '훌륭해요!';
      fireConfetti(24);
    } else {
      btn.classList.add('wrong');
      buttons[q.answer].classList.add('correct');
      els.card.classList.add('shake');
      setTimeout(() => els.card.classList.remove('shake'), 600);
      els.result.classList.add('show', 'no');
      els.verdict.textContent = '땡! 아쉽지만 오답이에요';
      const correctNo = q.answer + 1;
      els.explain.innerHTML = '정답은 <b>' + correctNo + '번</b>이에요. ' + (q.explain || '');
    }

    els.qtag.textContent = (state.step + 1) + ' / ' + TOTAL + ' · 정답 ' + state.correct + '개';

    const btnClass = correct ? 'btn' : 'btn retry';
    els.footer.innerHTML = '<button class="' + btnClass + '" id="nextBtn" type="button">' + nextLabel + '</button>';
    document.getElementById('nextBtn').addEventListener('click', advance);
  }

  function advance() {
    if (state.step >= TOTAL - 1) {
      showFinal();
    } else {
      state.step++;
      renderQuestion();
    }
  }

  function showFinal() {
    const passed = state.correct >= PASS_THRESHOLD;

    els.qhead.style.display = 'none';
    els.qtext.style.display = 'none';
    els.options.style.display = 'none';
    els.result.classList.remove('show', 'ok', 'no');

    els.final.innerHTML =
      '<div class="headline">' + (passed ? '🎉 미션 클리어!' : '💪 아쉬워요!') + '</div>' +
      '<div class="score-ring">' +
        '<span class="big">' + state.correct + '</span>' +
        '<span class="sep">/</span>' +
        '<span class="total">' + TOTAL + '</span>' +
      '</div>' +
      '<div class="msg">' + (passed
        ? '11문제 중 <b>' + state.correct + '문제</b>를 맞히셨어요!<br>경품 받을 자격 충분해요. 🌱'
        : '11문제 중 <b>' + state.correct + '문제</b> 정답.<br>5문제 이상 맞히면 경품을 받을 수 있어요. 다시 도전!'
      ) + '</div>';

    els.final.classList.add('show', passed ? 'ok' : 'no');

    if (passed) {
      if (SHOW_PRIZE) {
        els.prizeBody.innerHTML = PRIZE_NOTICE;
        els.prize.classList.add('show');
      }
      fireConfetti(120);
    } else {
      els.prize.classList.remove('show');
    }

    els.footer.innerHTML = '<button class="btn ' + (passed ? 'ghost' : 'retry') + '" id="restartBtn" type="button">' + (passed ? '다시 풀기' : '처음부터 다시 풀기') + '</button>';
    document.getElementById('restartBtn').addEventListener('click', startQuiz);
  }

  function fireConfetti(total) {
    total = total || 80;
    const colors = ['#3aa663', '#1f7a44', '#3b9ad8', '#f6c343', '#a8d96a', '#79c9a6'];
    for (let k = 0; k < total; k++) {
      const piece = document.createElement('i');
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.6) + 's';
      piece.style.animationDuration = (1.7 + Math.random() * 1.6) + 's';
      piece.style.width = (8 + Math.random() * 8) + 'px';
      piece.style.height = (10 + Math.random() * 10) + 'px';
      piece.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      els.confetti.appendChild(piece);
    }
    setTimeout(clearConfetti, 3400);
  }

  function clearConfetti() {
    els.confetti.innerHTML = '';
  }

  startQuiz();
</script>
